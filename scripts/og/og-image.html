<!doctype html>
<!-- The link preview card (public/og-image.png), drawn like the landing page's first screen: a dark card with the elf
     hanging over its corner, on a transparent background. Rendered at 1200x630 by render.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Cuprum";
        font-weight: 400 600;
        src: url("../../src/fonts/cuprum-latin.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: "Cuprum", sans-serif;
        /* Transparent around the card: each chat app shows its own background there. */
        background: transparent;
      }

      .card {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 70px;
        height: 490px;
        padding: 60px 200px 0 60px;
        border-radius: 40px;
        /* Solid, so it stays dark on a white chat too, with a soft red glow behind the elf. */
        background:
          radial-gradient(circle at 80% 50%, rgb(179 32 44 / 0.22), transparent 50%),
          #120507;
        border: 1.5px solid rgb(255 255 255 / 0.14);
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.35);
        color: #e4e4e7;
        overflow: hidden;

        > * {
          position: relative;
        }
      }

      /* A stage spotlight from just past the card's left edge, near the top (-46px, 52px), aimed at the elf (about
         102deg from straight up) and fading with distance. It lands on a circle of light behind him, so his white
         outline sits on a lit patch rather than on near-black. */
      .card::before,
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .card::before {
        background: conic-gradient(
          from 0deg at -46px 52px,
          transparent 90deg,
          rgb(255 232 214 / 0.14) 93deg,
          rgb(255 232 214 / 0.2) 102deg,
          rgb(255 232 214 / 0.14) 111deg,
          transparent 114deg
        );
        filter: blur(7px);
        mask-image: radial-gradient(circle at -46px 52px, #000 15%, rgb(0 0 0 / 0.6) 100%);
      }

      .card::after {
        background:
          radial-gradient(circle at -46px 52px, rgb(255 240 228 / 0.3), transparent 150px),
          radial-gradient(circle 250px at 837px 245px, rgb(255 232 214 / 0.2) 55%, rgb(255 232 214 / 0.08) 85%, transparent);
      }

      .pill {
        display: inline-block;
        padding: 6px 20px 7px;
        border-radius: 999px;
        background: #b3202c;
        color: #fff;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 30px;
        font-size: 122px;
        font-weight: 600;
        line-height: 0.92;
        letter-spacing: -0.01em;
        color: #fff;
      }

      h1 span {
        color: #ef4351;
      }

      .site {
        position: absolute;
        left: 60px;
        /* Stops short of the elf. */
        right: 460px;
        bottom: 44px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-top: 22px;
        border-top: 1px solid rgb(255 255 255 / 0.12);
        font-size: 26px;
        color: #a1a1aa;
      }

      .site b {
        font-weight: 600;
        color: #f4f4f5;
      }

      /* The sticker has a wide transparent margin, so it's drawn large and placed by what shows: its drawn part sits
         about 32px from the card's top, bottom and right edges. */
      .elf {
        position: absolute;
        right: 49px;
        top: 50%;
        width: 504px;
        height: 504px;
        transform: translateY(calc(-50% + 8px)) rotate(8deg);
        filter: drop-shadow(0 18px 30px rgb(0 0 0 / 0.5));
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="pill">You're invited</span>
      <h1>Secret gift <span>exchange</span></h1>
      <div class="site"><b>Anonymous Ded Morozes</b><span>gnomik.me</span></div>
    </div>
    <img class="elf" src="../../public/elf-2.webp" alt="" />
  </body>
</html>
