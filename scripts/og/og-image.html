<!doctype html>
<!-- The link preview card (public/og-image.png), drawn like the landing page's first screen: the HO HO HO photo behind
     a dark glass card, with the elf hanging over its corner. Rendered at 1200x630 by render.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Cuprum";
        font-weight: 400 600;
        src: url("../../src/fonts/cuprum-latin.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: "Cuprum", sans-serif;
        background: #170505 url("../../public/login-garage-door.jpg") center / cover;
      }

      .card {
        position: absolute;
        left: 64px;
        top: 70px;
        width: 780px;
        height: 490px;
        padding: 60px 200px 0 60px;
        border-radius: 40px;
        background: rgb(10 4 5 / 0.72);
        border: 1.5px solid rgb(255 255 255 / 0.14);
        backdrop-filter: blur(16px) saturate(0.8);
        box-shadow: 0 20px 60px rgb(0 0 0 / 0.55);
        color: #e4e4e7;
      }

      .pill {
        display: inline-block;
        padding: 6px 20px 7px;
        border-radius: 999px;
        background: #b3202c;
        color: #fff;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 30px;
        font-size: 122px;
        font-weight: 600;
        line-height: 0.92;
        letter-spacing: -0.01em;
        color: #fff;
      }

      h1 span {
        color: #ef4351;
      }

      .site {
        position: absolute;
        left: 60px;
        right: 250px;
        bottom: 44px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-top: 22px;
        border-top: 1px solid rgb(255 255 255 / 0.12);
        font-size: 26px;
        color: #a1a1aa;
      }

      .site b {
        font-weight: 600;
        color: #f4f4f5;
      }

      /* The sticker has a wide transparent margin, so it's drawn large and placed by its middle, as on the landing. */
      .elf {
        position: absolute;
        right: 10px;
        top: 50%;
        width: 520px;
        height: 520px;
        transform: translateY(-50%) rotate(8deg);
        filter: drop-shadow(0 18px 30px rgb(0 0 0 / 0.5));
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="pill">You're invited</span>
      <h1>Secret gift <span>exchange</span></h1>
      <div class="site"><b>Anonymous Ded Morozes</b><span>gnomik.me</span></div>
    </div>
    <img class="elf" src="../../public/elf-2.webp" alt="" />
  </body>
</html>
